<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boca Juniors</title>
    <link rel="stylesheet" href="style-panel.css">
    <link rel="icon" href="imagenes-escudos/ultimo-escudo.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
</head>

<body>
    
<div>
        <h1 class="titulo">Boca Juniors</h1>
</div>

<div class="botones"> 

    <nav>

        <a href="Pag-escudos.html"> 
        <button type="button" title="Escudos">
            <span>Escudos</span>
            <span class="material-symbols-outlined" aria-hidden="true">shield</span>
            <svg viewBox="0 0 300 300" aria-hidden="true">
                <g>
                    <text fill="currentColor">
                        <textPath xlink:href="#circlePath">Escudos</textPath>
                    </text>
                    <text fill="currentColor">
                        <textPath xlink:href="#circlePath" startOffset="50%">Escudos</textPath>
                    </text>
                </g>
            </svg>
        </button>    
        </a>

        <a href="Pag-idolos.html">
        <button type="button" title="Idolos">
            <span>Idolos</span>
            <span class="material-symbols-outlined" aria-hidden="true">Accessibility</span>
            <svg viewBox="0 0 300 300" aria-hidden="true">
                <g>
                    <text fill="currentColor">
                    <textPath xlink:href="#circlePath">Idolos</textPath>
                    </text>
                    <text fill="currentColor">
                    <textPath xlink:href="#circlePath" startOffset="50%">Idolos</textPath>
                    </text>
                </g>
            </svg>
        </button>
        </a>

        <a href="Pag-titulosInternacionales.html">
        <button type="button" title="Titulos">
            <span>Titulos</span>
            <span class="material-symbols-outlined" aria-hidden="true">trophy</span>
            <svg viewBox="0 0 300 300" aria-hidden="true">
                <g>
                    <text fill="currentColor">
                    <textPath xlink:href="#circlePath">Titulos</textPath>
                    </text>
                    <text fill="currentColor">
                    <textPath xlink:href="#circlePath" startOffset="50%">Titulos</textPath>
                    </text>
                </g>
            </svg>
        </button>
        </a>

    </nav>

</div>


<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 300" width="0" height="0">
    <defs>
        <path id="circlePath" d="M 150, 150 m -50, 0 a 50,50 0 0,1 100,0 a 50,50 0 0,1 -100,0" />
    </defs>
</svg>

</body>

</html>
